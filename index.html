<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L&amp;D Pulse — Proposals for Improvement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4D88E8; --teal:#40BDA9; --amber:#FFBC3A; --rose:#F26A44; --navy:#080828;
  --bg:#080828; --surface:#0E1038; --surface-2:#161a4c; --surface-3:#1D2158;
  --border:#2B2F6B; --text:#EBF4FF; --dim:#98A2D8; --faint:#6B74AA;
  --shadow:0 14px 40px rgba(0,0,0,.42); --logo:#EBF4FF; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F5FD; --surface:#FFFFFF; --surface-2:#F5F8FE; --surface-3:#E6ECFB;
  --border:#D6DFF5; --text:#0B0F30; --dim:#4C5684; --faint:#848EB4;
  --shadow:0 12px 34px rgba(16,22,60,.11); --logo:#080828; color-scheme:light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
body{
  background:
    radial-gradient(900px 480px at 80% -12%, rgba(77,136,232,.11), transparent 62%),
    radial-gradient(760px 420px at -8% 8%, rgba(64,189,169,.07), transparent 58%),
    var(--bg);
  color:var(--text); font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  font-size:14px; line-height:1.6; -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column; height:100%; overflow:hidden;
}
body[data-lang="ar"]{font-family:'Cairo','Segoe UI',system-ui,Arial,sans-serif;line-height:1.9;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60;}
header{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);padding:15px 22px 13px;z-index:20;}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo{color:var(--logo);flex:0 0 auto;} .logo svg{display:block;height:27px;width:auto;}
.divider{width:1px;height:30px;background:var(--border);}
h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.25px;}
.sub{margin:4px 0 0;color:var(--dim);font-size:12px;max-width:700px;}
.grow{flex:1 1 auto;} .tools{display:flex;gap:7px;flex-wrap:wrap;}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;padding:7px 14px;border-radius:9px;
  font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--surface-2);
  color:var(--dim);transition:.14s;font-family:inherit;white-space:nowrap;}
.btn:hover{color:var(--text);border-color:var(--faint);}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.navrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;}
.nav{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;
  border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--border);
  background:var(--surface-2);color:var(--dim);transition:.14s;font-family:inherit;white-space:nowrap;}
.nav:hover{color:var(--text);} .nav .dot{width:8px;height:8px;border-radius:50%;}
#stage{flex:1 1 auto;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;}
#canvas{position:relative;padding:44px 34px 96px;}
#wires{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.node{position:absolute;border-radius:14px;background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow);transition:transform .12s,border-color .12s;}
.node.tappable{cursor:pointer;} .node.tappable:hover{transform:translateY(-2px);}
.node:focus-visible{outline:2px solid var(--blue);outline-offset:3px;}
.node .pad{padding:13px 16px;}
.tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;margin-bottom:7px;}
.ttl{font-size:13.5px;font-weight:700;line-height:1.45;}
body[data-lang="ar"] .ttl{line-height:1.75;}
.sht{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.55;font-weight:500;}
body[data-lang="ar"] .sht{line-height:1.85;}
.toggle{position:absolute;top:50%;transform:translateY(-50%);min-width:25px;height:23px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;padding:0 7px;
  background:var(--surface-3);color:var(--dim);border:1px solid var(--border);}
.node.open .toggle{color:#fff;}
.node.lv0{background:var(--navy);border-color:var(--blue);border-width:2px;}
.node.lv0 .ttl{font-size:16px;font-weight:800;color:#EBF4FF;} .node.lv0 .sht{color:#98A2D8;}
.node.lv1{border-width:2px;} .node.lv1 .ttl{font-size:14px;font-weight:800;}
.node.card{background:var(--surface-2);border-inline-start-width:3px;}
.node.card .ttl{font-size:12.5px;font-weight:800;}
.bd{font-size:12px;line-height:1.78;margin-top:9px;}
body[data-lang="ar"] .bd{line-height:2.05;font-size:12.5px;}
.bd p{margin:0 0 9px;} .bd p:last-child{margin-bottom:0;}
.bd ul{margin:0 0 9px;padding-inline-start:17px;} .bd li{margin-bottom:4px;}
.bd b{font-weight:800;}
.bd table{width:100%;border-collapse:collapse;margin:0 0 9px;font-size:11.5px;}
.bd th,.bd td{border:1px solid var(--border);padding:5px 8px;text-align:start;line-height:1.55;}
body[data-lang="ar"] .bd th,body[data-lang="ar"] .bd td{line-height:1.85;}
.bd th{background:var(--surface-3);font-weight:800;font-size:10.5px;color:var(--dim);}
.bd td.n{font-weight:800;}
.bd .ok{color:var(--teal);} .bd .hi{color:var(--rose);} .bd .mid{color:var(--amber);}
.bd .q{border-inline-start:3px solid var(--blue);background:rgba(77,136,232,.1);padding:8px 11px;
  border-radius:0 9px 9px 0;margin:0 0 9px;font-size:11.5px;}
body[data-lang="ar"] .bd .q{border-radius:9px 0 0 9px;}
.bd .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-3);
  border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin:0 0 9px;font-size:10.5px;
  line-height:1.9;direction:ltr;text-align:left;white-space:pre;overflow-x:auto;}
.bd .sug{color:var(--teal);} .bd .now{color:var(--dim);}
.pair{display:grid;gap:8px;margin:0 0 9px;}
.pair .b{border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--surface);}
.pair .b .h{font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;margin-bottom:4px;}
.pair .b.a .h{color:var(--dim);} .pair .b.c .h{color:var(--teal);}
.box{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 0 9px;background:var(--surface);}
.box .h{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
.src{font-size:10px;color:var(--faint);margin-top:9px;padding-top:8px;border-top:1px dashed var(--border);line-height:1.7;}
#hint{position:fixed;bottom:14px;inset-inline-start:18px;z-index:30;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:7px 13px;font-size:11px;color:var(--dim);
  box-shadow:var(--shadow);font-weight:600;margin-bottom:env(safe-area-inset-bottom,0px);}
@media (max-width:760px){
  header{padding:12px 15px 10px;} h1{font-size:15.5px;} .sub,.divider{display:none;}
  #canvas{padding:28px 18px 84px;} #hint{display:none;}
}
</style>
</head>

<script>
var C={blue:'#4D88E8',teal:'#40BDA9',amber:'#FFBC3A',rose:'#F26A44'};
var UI={
 en:{h1:'L&D Pulse — Proposals for Improvement',
     sub:'Observations and suggestions on how our performance measurement could be made clearer and closer to the work. Tap any card to open what sits under it.',
     all:'Expand all',top:'Top level',theme:'Light / dark',lang:'العربية',hint:'Tap a card to open what is under it'},
 ar:{h1:'L&D Pulse — مقترحات للتطوير',
     sub:'ملاحظات ومقترحات حول كيفية جعل قياس الأداء أوضح وأقرب إلى طبيعة العمل. اضغط على أي بطاقة لفتح ما تحتها.',
     all:'فتح الكل',top:'المستوى الأول',theme:'فاتح / غامق',lang:'English',hint:'اضغط على البطاقة لفتح ما تحتها'}
};

var TREE={id:'root',color:C.blue,open:true,
 t:{en:'L&D Pulse',ar:'L&D Pulse'},
 s:{en:'Observations & proposals',ar:'ملاحظات ومقترحات'},
 c:[

/* ===== 1 · COORDINATION ===== */
{id:'co',color:C.blue,
 t:{en:'1 · Coordination hours',ar:'١ · ساعات التنسيق'},
 s:{en:'Work with no category to go into',ar:'عمل لا يجد تصنيفاً يُسجَّل فيه'},
 c:[
  {id:'co1',card:1,color:C.blue,tag:{en:'Observation',ar:'ملاحظة'},
   t:{en:'It has nowhere to be recorded',ar:'لا مكان لتسجيله'},
   b:{en:'<p>Deliverable hours come from the type catalogue, which covers the design work well. Work that has no type in the catalogue has nowhere to be recorded at all.</p><ul><li>Studying content before briefing a trainer</li><li>Preparing for a client meeting on a topic new to us</li><li>Answering trainer questions during implementation</li><li>Coordinating with Business Development while a programme runs</li><li>Reviewing a colleague’s work internally</li><li>Logistics, files and server preparation</li><li>Sending and replying to email and Slack through the day</li></ul><p>This is real work that takes real hours, and those hours come out of the same month the target is measured against.</p>',
      ar:'<p>ساعات المخرجات تأتي من catalogue الأنواع، وهو يغطي عمل التصميم جيداً. أما العمل الذي لا يقابله نوع في الـ catalogue فلا يجد مكاناً يُسجَّل فيه إطلاقاً.</p><ul><li>دراسة المحتوى قبل شرحه لمدرّب</li><li>التحضير لاجتماع عميل في موضوع جديد علينا</li><li>الإجابة عن أسئلة المدرّب أثناء التنفيذ</li><li>التنسيق مع Business Development أثناء تشغيل البرنامج</li><li>مراجعة عمل زميل داخلياً</li><li>اللوجستيات والملفات وتجهيز السيرفر</li><li>إرسال الرسائل والرد عليها على البريد و Slack على مدار اليوم</li></ul><p>وهذا عمل حقيقي يستهلك ساعات حقيقية، وهذه الساعات تُخصم من الشهر نفسه الذي يُقاس عليه الهدف.</p>'}},

  {id:'co2',card:1,color:C.teal,tag:{en:'Proposal',ar:'مقترح'},
   t:{en:'A checklist, not a detailed entry',ar:'قائمة اختيار، لا إدخال تفصيلي'},
   b:{en:'<p>The point is not to describe what was done. It is a <b>checklist</b>: tick what happened and move on. "Spoke to a trainer" is one tick — no description, no justification, no form to fill.</p><div class="box"><div class="h">What it looks like</div>Pick the programme, tick one or more boxes, pick a duration, done.<br><br>☐ Trainer support &nbsp;&nbsp;☐ Content study<br>☐ Client prep &nbsp;&nbsp;☐ BD coordination<br>☐ Internal review &nbsp;&nbsp;☐ Logistics &amp; files<br>☐ Email &amp; Slack &nbsp;&nbsp;☐ Other</div><p>Fixed categories rather than free text, so the data stays usable. One reminder a day. Two taps and it is done — if it takes longer than that, nobody will use it.</p><table><tr><th>Guardrail</th><th>Limit</th></tr><tr><td>Per day without a note</td><td class="n">2 hours</td></tr><tr><td>Backdating</td><td class="n">3 days</td></tr><tr><td>Visible to Team Lead</td><td>All entries</td></tr></table><p>The "Other" box matters most. What people tick there over a few months tells us which categories are missing, instead of us guessing.</p>',
      ar:'<p>الهدف ليس وصف ما تم عمله. إنها <b>قائمة اختيار</b>: نضع علامة على ما حدث ونمضي. «كلّمت مدرّباً» علامة واحدة — بلا وصف، ولا تبرير، ولا نموذج يُملأ.</p><div class="box"><div class="h">شكلها</div>اختر البرنامج، ضع علامة على بند أو أكثر، اختر المدة، انتهى.<br><br>☐ دعم المدرّب &nbsp;&nbsp;☐ دراسة محتوى<br>☐ تحضير اجتماع &nbsp;&nbsp;☐ تنسيق مع BD<br>☐ مراجعة داخلية &nbsp;&nbsp;☐ لوجستيات وملفات<br>☐ بريد و Slack &nbsp;&nbsp;☐ أخرى</div><p>تصنيفات ثابتة بدل الكتابة الحرة، حتى تبقى البيانات قابلة للاستخدام. وتذكير واحد يومياً. ضغطتان ويكتمل — فإن استغرق أكثر من ذلك فلن يستخدمه أحد.</p><table><tr><th>الضابط</th><th>الحد</th></tr><tr><td>يومياً دون ملاحظة</td><td class="n">ساعتان</td></tr><tr><td>التسجيل بأثر رجعي</td><td class="n">٣ أيام</td></tr><tr><td>ظاهر لـ Team Lead</td><td>كل التسجيلات</td></tr></table><p>وخانة «أخرى» هي الأهم. فما يضع الفريق علامة عليه فيها خلال أشهر قليلة سيدلّنا على التصنيفات الناقصة بدل أن نخمّنها.</p>'}},

  {id:'co3',card:1,color:C.teal,tag:{en:'Proposal',ar:'مقترح'},
   t:{en:'No fixed number of hours for coordination',ar:'بلا عدد ساعات ثابت للتنسيق'},
   b:{en:'<p>Our work is not the same shape every month. One month can be almost entirely content and materials. The next can be mostly coordination, because several programmes are in implementation at once. It changes from one day to the next, let alone one month to the next.</p><p>So coordination should not carry a fixed target of its own. Instead, coordination hours sit inside <b>Productive Hours</b> together with deliverable hours, and the two are counted as one number.</p><table><tr><th>Month</th><th>Deliv.</th><th>Coord.</th><th>Total</th><th>Score</th></tr><tr><td>Content-heavy</td><td>120</td><td>10</td><td class="n">130</td><td class="n ok">99%</td></tr><tr><td>Implementation-heavy</td><td>75</td><td>55</td><td class="n">130</td><td class="n ok">99%</td></tr><tr><td>A genuinely light month</td><td>60</td><td>10</td><td class="n">70</td><td class="n mid">53%</td></tr></table><p>The measure then answers "was this a full month of work" rather than "was it the kind of work we expected".</p>',
      ar:'<p>عملنا ليس على شكل واحد كل شهر. فقد يكون شهر كله تقريباً محتوى ومواد، ويكون الذي يليه أغلبه تنسيقاً لأن عدة برامج في مرحلة التنفيذ معاً. والأمر يختلف من يوم لآخر، فضلاً عن شهر لآخر.</p><p>لذلك لا ينبغي أن يحمل التنسيق هدفاً ثابتاً خاصاً به. بل تدخل ساعاته ضمن <b>الساعات المنتجة</b> مع ساعات المخرجات، ويُحتسب الاثنان رقماً واحداً.</p><table><tr><th>الشهر</th><th>مخرجات</th><th>تنسيق</th><th>المجموع</th><th>الدرجة</th></tr><tr><td>شهر محتوى</td><td>١٢٠</td><td>١٠</td><td class="n">١٣٠</td><td class="n ok">٩٩٪</td></tr><tr><td>شهر تنفيذ</td><td>٧٥</td><td>٥٥</td><td class="n">١٣٠</td><td class="n ok">٩٩٪</td></tr><tr><td>شهر خفيف فعلاً</td><td>٦٠</td><td>١٠</td><td class="n">٧٠</td><td class="n mid">٥٣٪</td></tr></table><p>فيصبح المقياس يجيب عن «هل كان هذا شهر عمل كامل؟» لا عن «هل كان نوع العمل هو المتوقَّع؟».</p>'}}
 ]},

/* ===== 2 · HOURS TARGET ===== */
{id:'h',color:C.teal,
 t:{en:'2 · The monthly hours target',ar:'٢ · هدف الساعات الشهري'},
 s:{en:'160 hours, and what a month actually holds',ar:'١٦٠ ساعة، وما يتسع له الشهر فعلياً'},
 c:[
  {id:'h1',card:1,color:C.teal,tag:{en:'Observation',ar:'ملاحظة'},
   t:{en:'The target and the available month',ar:'الهدف والشهر المتاح'},
   b:{en:'<p>The Effort component measures deliverable hours against a fixed target of <b>160 hours</b> a month. Alongside it, Training Monitoring expects <b>12 hours</b>, and those hours are logged separately — they do not count toward the 160. Together, <b>172 hours</b>.</p><p>A working month here averages 21.75 days, or <b>174 hours</b>. After annual leave and public holidays, about <b>151 hours</b> remain.</p><table><tr><th></th><th>Hours</th></tr><tr><td>Required (160 + 12)</td><td class="n hi">172</td></tr><tr><td>Actually available</td><td class="n">151</td></tr></table>',
      ar:'<p>بند Effort يقيس ساعات المخرجات مقابل هدف ثابت قدره <b>١٦٠ ساعة</b> شهرياً. وإلى جانبه، يتوقع Training Monitoring <b>١٢ ساعة</b>، وتُسجَّل هذه الساعات في سجل منفصل — فهي لا تُحتسب ضمن الـ ١٦٠. والمجموع <b>١٧٢ ساعة</b>.</p><p>ومتوسط شهر العمل لدينا ٢١.٧٥ يوماً، أي <b>١٧٤ ساعة</b>. وبعد خصم الإجازة السنوية والإجازات الرسمية، يتبقى نحو <b>١٥١ ساعة</b>.</p><table><tr><th></th><th>ساعات</th></tr><tr><td>المطلوب (١٦٠ + ١٢)</td><td class="n hi">١٧٢</td></tr><tr><td>المتاح فعلياً</td><td class="n">١٥١</td></tr></table>'}},

  {id:'h2',card:1,color:C.teal,tag:{en:'Observation',ar:'ملاحظة'},
   t:{en:'How design work is normally measured',ar:'كيف يُقاس العمل التصميمي عادةً'},
   b:{en:'<p>Design work is rarely measured at full utilization, and for a practical reason: research, thinking and revision produce nothing visible until the end. Two days of thinking can surface as one day of output.</p><p>Published benchmarks for comparable roles reflect that.</p><table><tr><th>Benchmark</th><th>Utilization</th></tr><tr><td>Optimal target</td><td class="n ok">75%</td></tr><tr><td>Sustainable range</td><td class="n">70–80%</td></tr><tr><td>Industry actual, 2025</td><td class="n">66.4%</td></tr><tr><td><b>Our current target</b></td><td class="n hi">114%</td></tr></table>',
      ar:'<p>نادراً ما يُقاس العمل التصميمي على أساس استغلال كامل للوقت، ولسبب عملي: البحث والتفكير والمراجعة لا تُنتج شيئاً ظاهراً إلا في النهاية. فقد يظهر يومان من التفكير في صورة يوم واحد من المخرجات.</p><p>والمعايير المنشورة لأدوار مشابهة تعكس ذلك.</p><table><tr><th>المعيار</th><th>Utilization</th></tr><tr><td>الهدف الأمثل</td><td class="n ok">٧٥٪</td></tr><tr><td>النطاق المستدام</td><td class="n">٧٠–٨٠٪</td></tr><tr><td>الفعلي في الصناعة ٢٠٢٥</td><td class="n">٦٦.٤٪</td></tr><tr><td><b>هدفنا الحالي</b></td><td class="n hi">١١٤٪</td></tr></table>'}},

  {id:'h3',card:1,color:C.teal,tag:{en:'Proposal',ar:'مقترح'},
   t:{en:'How the 151 hours are allocated',ar:'كيف تُوزَّع الساعات الـ ١٥١'},
   b:{en:'<p>Start from the 75% benchmark and work down.</p><table><tr><th>Step</th><th>Hours</th><th>Of available</th></tr><tr><td><b>Available in an average month</b></td><td class="n">151</td><td>100%</td></tr><tr><td>Client-facing work — the benchmark</td><td class="n">113</td><td class="ok">75%</td></tr><tr><td>&nbsp;&nbsp;— of which deliverables</td><td class="n">101</td><td></td></tr><tr><td>&nbsp;&nbsp;— of which monitoring</td><td class="n ok">12 — fixed</td><td></td></tr><tr><td>Coordination</td><td class="n">30</td><td>20%</td></tr><tr><td>Unlogged — switching between tasks</td><td class="n">8</td><td>5%</td></tr></table><p>Two separate components come out of that:</p><div class="box"><div class="h">Productive hours — 15% of the score</div>deliverables 101 + coordination 30 = <b>131 hours</b>, which is <b>87%</b> of available time.</div><div class="box"><div class="h">Training Monitoring — 5% of the score</div><b>12 hours</b>, fixed, scored on its own. Coordination hours cannot stand in for it.</div><p><b>Why 87% and not 75%:</b> the two percentages measure different things. 75% is the benchmark for client-facing work only — published standards classify coordination as necessary work outside that figure. 87% is simply what we log in total, once coordination is added back in.</p>',
      ar:'<p>نبدأ من معيار الـ ٧٥٪ وننزل منه.</p><table><tr><th>الخطوة</th><th>ساعات</th><th>من المتاح</th></tr><tr><td><b>المتاح في شهر متوسط</b></td><td class="n">١٥١</td><td>١٠٠٪</td></tr><tr><td>العمل الموجَّه للعميل — المعيار</td><td class="n">١١٣</td><td class="ok">٧٥٪</td></tr><tr><td>&nbsp;&nbsp;— منها مخرجات</td><td class="n">١٠١</td><td></td></tr><tr><td>&nbsp;&nbsp;— منها مونيتورينج</td><td class="n ok">١٢ — ثابتة</td><td></td></tr><tr><td>التنسيق</td><td class="n">٣٠</td><td>٢٠٪</td></tr><tr><td>غير مسجَّل — التنقّل بين المهام</td><td class="n">٨</td><td>٥٪</td></tr></table><p>ويخرج من ذلك بندان منفصلان:</p><div class="box"><div class="h">الساعات المنتجة — ١٥٪ من الدرجة</div>مخرجات ١٠١ + تنسيق ٣٠ = <b>١٣١ ساعة</b>، أي <b>٨٧٪</b> من الوقت المتاح.</div><div class="box"><div class="h">Training Monitoring — ٥٪ من الدرجة</div><b>١٢ ساعة</b>، ثابتة، تُقيَّم وحدها. ولا يمكن لساعات التنسيق أن تحل محلها.</div><p><b>لماذا ٨٧٪ وليس ٧٥٪:</b> النسبتان تقيسان شيئين مختلفين. فـ ٧٥٪ معيارٌ للعمل الموجَّه للعميل وحده — والمعايير المنشورة تصنّف التنسيق عملاً ضرورياً خارج هذا الرقم. أما ٨٧٪ فهي ببساطة ما نسجّله في المجموع بعد إضافة التنسيق.</p>'}},

  {id:'h4',card:1,color:C.teal,tag:{en:'Proposal',ar:'مقترح'},
   t:{en:'The target follows each month’s own capacity',ar:'الهدف يتبع طاقة كل شهر'},
   b:{en:'<div class="mono"><span class="sug">available = (working days − public holidays − approved leave) × 8\ntarget    = available × 87%</span></div><table><tr><th>Month</th><th>Days</th><th>Available</th><th>Target</th></tr><tr><td>February</td><td>20</td><td>160h</td><td class="n">139h</td></tr><tr><td>March, with a 3-day Eid</td><td>20</td><td>160h</td><td class="n">139h</td></tr><tr><td>A month with 5 days leave</td><td>16</td><td>128h</td><td class="n">111h</td></tr><tr><td>A full month</td><td>22</td><td>176h</td><td class="n">153h</td></tr></table><p>The result is read as a percentage, so one month stays comparable with the next however many days it had. This is how resource-planning tools normally set it: capacity is calculated per period after leave and holidays, and the target percentage is applied to that.</p>',
      ar:'<div class="mono"><span class="sug">المتاح = (أيام العمل − الإجازات الرسمية − الإجازة المعتمدة) × 8\nالهدف  = المتاح × 87%</span></div><table><tr><th>الشهر</th><th>أيام</th><th>المتاح</th><th>الهدف</th></tr><tr><td>فبراير</td><td>٢٠</td><td>١٦٠ س</td><td class="n">١٣٩ س</td></tr><tr><td>مارس، وبه عيد ٣ أيام</td><td>٢٠</td><td>١٦٠ س</td><td class="n">١٣٩ س</td></tr><tr><td>شهر به ٥ أيام إجازة</td><td>١٦</td><td>١٢٨ س</td><td class="n">١١١ س</td></tr><tr><td>شهر كامل</td><td>٢٢</td><td>١٧٦ س</td><td class="n">١٥٣ س</td></tr></table><p>وتُقرأ النتيجة كنسبة مئوية، فيبقى الشهر قابلاً للمقارنة بالذي يليه مهما اختلف عدد أيامه. وهكذا تضبطه أدوات تخطيط الموارد عادةً: تُحسب الطاقة لكل فترة بعد الإجازات والعطلات، ثم تُطبَّق عليها نسبة الهدف.</p>'}}
 ]},

/* ===== 3 · MONITORING ===== */
{id:'m',color:C.amber,
 t:{en:'3 · Training Monitoring',ar:'٣ · Training Monitoring'},
 s:{en:'Two different targets inside the same system',ar:'هدفان مختلفان داخل النظام نفسه'},
 c:[
  {id:'m1',card:1,color:C.amber,tag:{en:'Observation',ar:'ملاحظة'},
   t:{en:'We cannot tell which figure applies',ar:'لا نعرف أي رقم هو المعتمد'},
   b:{en:'<p>Monitoring carries 5% of the score. What confuses us as a team is that the system holds <b>two different monthly figures</b> for it, and neither is published.</p><table><tr><th>Where</th><th>Monthly figure</th></tr><tr><td>Heroes Score</td><td class="n">12 hours</td></tr><tr><td>Competency scoring rules</td><td class="n">4 hours</td></tr></table><p>So a month that reads as complete in one place reads as three times over in the other, and none of us can say what a full month of monitoring actually is.</p><p>There is a second thing we notice. When hours are logged, the component is scored. When nothing is logged at all, it is treated as having no data and its weight moves across to the other components instead. So the same situation reads differently from one month to the next, and we cannot tell in advance whether this component will count or not.</p>',
      ar:'<p>يمثّل المونيتورينج ٥٪ من الدرجة. وما يربكنا كفريق أن النظام يحتفظ له بـ<b>رقمين شهريين مختلفين</b>، وكلاهما غير منشور.</p><table><tr><th>الموضع</th><th>الرقم الشهري</th></tr><tr><td>Heroes Score</td><td class="n">١٢ ساعة</td></tr><tr><td>قواعد تقييم الكفاءات</td><td class="n">٤ ساعات</td></tr></table><p>فالشهر الذي يُقرأ مكتملاً في موضع، يُقرأ ثلاثة أضعاف المطلوب في الموضع الآخر، ولا يستطيع أحدٌ منا أن يقول ما هو شهر المونيتورينج الكامل فعلاً.</p><p>وهناك أمر ثانٍ نلاحظه. فحين تُسجَّل ساعات، يُحتسب البند. وحين لا يُسجَّل شيء إطلاقاً، يُعامَل على أنه بلا بيانات، وينتقل وزنه إلى البنود الأخرى. وبذلك تُقرأ الحالة نفسها بشكل مختلف من شهر لآخر، ولا نستطيع أن نعرف مسبقاً إن كان هذا البند سيُحتسب أم لا.</p>'}},

  {id:'m2',card:1,color:C.teal,tag:{en:'Proposal',ar:'مقترح'},
   t:{en:'One published figure: 12 hours',ar:'رقم واحد معلن: ١٢ ساعة'},
   b:{en:'<p>Settle on <b>12 hours</b> as the stated monthly target, use the same figure in both places, publish it, and score from the first hour so every hour counts.</p><table><tr><th>Hours logged</th><th>Score</th></tr><tr><td>0</td><td class="n">0</td></tr><tr><td>6</td><td>2.5%</td></tr><tr><td class="n">12 — target</td><td class="n ok">5% — full</td></tr><tr><td>18</td><td>5% + 2.5% bonus</td></tr><tr><td>24</td><td>5% + 5% bonus (cap)</td></tr></table><p>The component keeps its weight either way, so a month with nothing logged scores zero rather than disappearing.</p><p>Where someone genuinely has no monitoring assigned, the Team Lead marks it as not applicable and the weight is set aside — recorded, so it stays visible.</p><p>One definition is still needed: <b>what counts as a monitoring hour</b> — a full session, half a session, with or without an observation note. <b>The Team Lead approves the logged hours.</b></p>',
      ar:'<p>نستقر على <b>١٢ ساعة</b> كهدف شهري معلن، ونستخدم الرقم نفسه في الموضعين، ونَنشُره، ونحتسب الدرجة من الساعة الأولى حتى تُحتسب كل ساعة.</p><table><tr><th>الساعات المسجَّلة</th><th>الدرجة</th></tr><tr><td>٠</td><td class="n">٠</td></tr><tr><td>٦</td><td>٢.٥٪</td></tr><tr><td class="n">١٢ — الهدف</td><td class="n ok">٥٪ — كاملة</td></tr><tr><td>١٨</td><td>٥٪ + بونص ٢.٥٪</td></tr><tr><td>٢٤</td><td>٥٪ + بونص ٥٪ (الحد الأقصى)</td></tr></table><p>ويحتفظ البند بوزنه في الحالتين، فالشهر الذي لا يُسجَّل فيه شيء يأخذ صفراً بدل أن يختفي.</p><p>وحين لا يكون أحد مكلَّفاً بمونيتورينج فعلاً، يضع Team Lead علامة «غير مطلوب» فيُنحَّى الوزن — مع تسجيل ذلك ليبقى ظاهراً.</p><p>ويبقى تعريف واحد مطلوباً: <b>ما الذي يُحتسب ساعة مونيتورينج</b> — جلسة كاملة، أم نصف جلسة، بتقرير ملاحظات أم بدونه. <b>و Team Lead هو من يعتمد الساعات المسجَّلة.</b></p>'}}
 ]},

/* ===== 4 · DELIVERY DATES ===== */
{id:'d',color:C.rose,
 t:{en:'4 · Delivery dates and the early bonus',ar:'٤ · تواريخ التسليم وبونص التبكير'},
 s:{en:'The bonus is worth 2% of the score',ar:'البونص يساوي ٢٪ من الدرجة'},
 c:[
  {id:'d1',card:1,color:C.rose,tag:{en:'Observation',ar:'ملاحظة'},
   t:{en:'Same work, two different readings',ar:'العمل نفسه، قراءتان مختلفتان'},
   b:{en:'<p>The early-delivery bonus is worth 2% of the score, and is measured as the gap between the delivery date and the deadline. The deadline is entered by the person picking up the task — so we are, in effect, choosing the figure our own bonus is measured against.</p><table><tr><th></th><th>Sara</th><th>Mona</th></tr><tr><td>Actual work</td><td>2 days</td><td>2 days</td></tr><tr><td>Deadline entered</td><td>5 days</td><td>2 days</td></tr><tr><td>Delivered in</td><td>2 days</td><td>2 days</td></tr><tr><td>Reads as</td><td class="n ok">+24h early</td><td class="n">on time</td></tr></table><p>Both did the same work in the same time. Nobody did anything wrong here — the measure is simply sensitive to how generously the date was estimated, and we are the ones estimating it.</p>',
      ar:'<p>بونص التسليم المبكر يساوي ٢٪ من الدرجة، ويُقاس بالفارق بين تاريخ التسليم و الـ deadline. و الـ deadline يُدخِله الشخص الذي يستلم المهمة — أي أننا عملياً نختار الرقم الذي يُقاس عليه بونصنا.</p><table><tr><th></th><th>سارة</th><th>منى</th></tr><tr><td>العمل الفعلي</td><td>يومان</td><td>يومان</td></tr><tr><td>الـ deadline المُدخَل</td><td>٥ أيام</td><td>يومان</td></tr><tr><td>سلّمت في</td><td>يومين</td><td>يومين</td></tr><tr><td>النظام يقرأ</td><td class="n ok">+٢٤ ساعة مبكراً</td><td class="n">في الموعد</td></tr></table><p>الاثنتان أدّتا العمل نفسه في المدة نفسها. ولم يُخطئ أحد هنا — المقياس حسّاس فقط لمقدار السماحة في تقدير التاريخ، ونحن من نقدّره.</p>'}},

  {id:'d2',card:1,color:C.rose,tag:{en:'Observation',ar:'ملاحظة'},
   t:{en:'One type, very different pieces of work',ar:'نوع واحد، وأعمال مختلفة تماماً'},
   b:{en:'<p>The catalogue gives each type a single duration. But the same type can be two very different jobs.</p><p>A Full Training Kit for a one-day training and a Full Training Kit for a three-day training are both logged as the same type, with the same number of days behind them. They are not the same piece of work, and recording them identically is not accurate for either one.</p>',
      ar:'<p>يمنح الـ catalogue كل نوع مدةً واحدة. غير أن النوع الواحد قد يكون عملين مختلفين تماماً.</p><p>فـ Full Training Kit لتدريب مدته يوم واحد، و Full Training Kit لتدريب مدته ثلاثة أيام، يُسجَّلان كنوع واحد وبعدد الأيام نفسه. وهما ليسا العمل نفسه، وتسجيلهما بالطريقة ذاتها ليس دقيقاً لأيٍّ منهما.</p>'}},

  {id:'d3',card:1,color:C.teal,tag:{en:'Proposal',ar:'مقترح'},
   t:{en:'The duration is agreed, not assumed',ar:'المدة يُتَّفق عليها، لا تُفترض'},
   b:{en:'<p>The bonus stays as it is, and so does the catalogue. What changes is <b>who decides the duration</b>.</p><p>When a task is assigned, the Team Lead and the person agree the duration together, drawing on the range the catalogue already publishes — for example Training PPT from scratch shows a range of 5 to 10 days. The person then enters what was agreed.</p><div class="box"><div class="h">Why it is agreed rather than fixed</div><b>1.</b> A kit for a one-day training and a kit for a three-day training cannot carry the same figure.<br><br><b>2.</b> The date stops being something we set on our own, so the bonus is measured against a figure both sides agreed.</div><p>The catalogue numbers stay exactly as they are. Only the conversation moves — to the two people who know whether the training is one day or three.</p>',
      ar:'<p>يبقى البونص كما هو، ويبقى الـ catalogue كما هو. والذي يتغيّر هو <b>من يحدّد المدة</b>.</p><p>فعند تكليف المهمة، يتفق Team Lead والشخص على المدة معاً، مستندين إلى المدى الذي ينشره الـ catalogue بالفعل — فمثلاً Training PPT from scratch أمامه مدى من ٥ إلى ١٠ أيام. ثم يُدخل الشخص ما تم الاتفاق عليه.</p><div class="box"><div class="h">لماذا يُتَّفق عليها بدل أن تكون ثابتة</div><b>١.</b> لا يمكن أن يحمل kit لتدريب يوم واحد و kit لتدريب ثلاثة أيام الرقم نفسه.<br><br><b>٢.</b> يتوقف التاريخ عن كونه شيئاً نضعه بمفردنا، فيُقاس البونص مقابل رقم اتفق عليه الطرفان.</div><p>وتبقى أرقام الـ catalogue كما هي تماماً. ما ينتقل هو الحوار فقط — إلى الشخصين اللذين يعرفان إن كان التدريب يوماً واحداً أم ثلاثة.</p>'}}
 ]},

/* ===== 5 · QUALITY ===== */
{id:'q',color:C.blue,
 t:{en:'5 · Design quality review',ar:'٥ · تقييم جودة التصميم'},
 s:{en:'On what basis the rating is decided',ar:'على أي أساس يُحدَّد التقييم'},
 c:[
  {id:'q1',card:1,color:C.blue,tag:{en:'Observation & proposal',ar:'ملاحظة ومقترح'},
   t:{en:'The levels need describing',ar:'المستويات تحتاج وصفاً'},
   b:{en:'<p>The review uses seven weighted criteria, each rated 1 to 4. The criteria themselves are sound and we are not suggesting any change to them or to their weights.</p><p>What is missing is the basis of the rating: there is nothing written describing what makes a piece of work a 4 rather than a 3. So when a review comes back, we cannot tell which specific thing to change next time.</p><p><b>The proposal is only to write the levels down.</b> For each of the seven criteria, a short line describing what each of the four levels looks like in practice — kept in the rating form itself, where the reviewer and the designer both see it.</p><p>Nothing else about the review changes. Same criteria, same weights, same scale.</p>',
      ar:'<p>يستخدم التقييم سبعة معايير موزونة، كل منها من ١ إلى ٤. والمعايير نفسها سليمة، ولا نقترح أي تغيير فيها ولا في أوزانها.</p><p>والناقص هو أساس التقييم: لا يوجد نصٌّ مكتوب يصف ما الذي يجعل العمل ٤ لا ٣. فحين تعود نتيجة المراجعة، لا نعرف ما الذي نغيّره تحديداً في المرة القادمة.</p><p><b>والمقترح هو كتابة المستويات فقط.</b> أي أن يُكتب لكل معيار من السبعة سطرٌ قصير يصف شكل كل مستوى من المستويات الأربعة عملياً — ويبقى داخل نموذج التقييم نفسه، حيث يراه المراجع والمصمّم معاً.</p><p>ولا يتغير شيء آخر في المراجعة. المعايير نفسها، والأوزان نفسها، والمقياس نفسه.</p>'}}
 ]},

/* ===== 6 · CALCULATION ===== */
{id:'a',color:C.rose,
 t:{en:'6 · Three points in how the score is calculated',ar:'٦ · ثلاث نقاط في طريقة احتساب الدرجة'},
 s:{en:'Each one changes the final number',ar:'كل واحدة منها تغيّر الرقم النهائي'},
 c:[
  {id:'a1',card:1,color:C.rose,tag:{en:'Today → Proposal',ar:'حالياً ← المقترح'},
   t:{en:'Missing data moves the weight',ar:'غياب البيانات ينقل الوزن'},
   b:{en:'<div class="pair"><div class="b a"><div class="h">Today</div>Four components behave this way — design quality, delivery compliance, monitoring and client satisfaction. Where nothing is recorded in a month, the component is treated as having no data and its weight is shared across the others.<br><br>So the weights shown on the page are not always the weights used, and two people in the same month can be scored on differently shaped scorecards while being compared on one number.</div><div class="b c"><div class="h">Proposal</div>Separate two cases that are currently read as one.<br><br><b>Not assigned this month</b> — marked by the Team Lead, the weight is set aside, and the decision is recorded.<br><br><b>Assigned and not done</b> — scores zero, and the weight stays where it is.<br><br>Default: the weight does not move.</div></div>',
      ar:'<div class="pair"><div class="b a"><div class="h">حالياً</div>أربعة بنود تتصرف بهذه الطريقة — جودة التصميم، و Delivery Compliance، والمونيتورينج، وتقييم العميل. فحين لا يُسجَّل شيء في الشهر، يُعامَل البند على أنه بلا بيانات ويُوزَّع وزنه على البقية.<br><br>وبذلك لا تكون الأوزان الظاهرة في الصفحة هي الأوزان المستخدمة دائماً، وقد يُقيَّم شخصان في الشهر نفسه على Scorecard بشكلين مختلفين ثم يُقارَنان برقم واحد.</div><div class="b c"><div class="h">المقترح</div>نفصل حالتين تُقرآن اليوم كحالة واحدة.<br><br><b>غير مطلوب هذا الشهر</b> — يضع Team Lead العلامة، ويُنحَّى الوزن، ويُسجَّل القرار.<br><br><b>مطلوب ولم يُنفَّذ</b> — يأخذ صفراً، ويبقى الوزن مكانه.<br><br>والأصل: الوزن لا يتحرك.</div></div>'}},

  {id:'a2',card:1,color:C.rose,tag:{en:'Today → Proposal',ar:'حالياً ← المقترح'},
   t:{en:'This month can show last year’s quality',ar:'الشهر الحالي قد يُظهر جودة العام الماضي'},
   b:{en:'<p>The system states this itself on the evaluation page:</p><div class="q">"Domain 1 Quality falls back to your all-time average until this month has a review."</div><div class="pair"><div class="b a"><div class="h">Today</div>Where the current month has no review yet, the figure shown is the average of every review since the start — so a number labelled November can in fact be carrying July.<br><br>And in an earlier month the same situation is handled the other way, by setting the weight aside, which makes one month hard to compare with the next.</div><div class="b c"><div class="h">Proposal</div>Show the current month as <b>awaiting review</b> rather than filling it with an older figure, and handle a missing review the same way in every month.</div></div>',
      ar:'<p>يذكر النظام ذلك بنفسه في صفحة التقييم:</p><div class="q">«Domain 1 Quality falls back to your all-time average until this month has a review.»</div><div class="pair"><div class="b a"><div class="h">حالياً</div>حين لا تكون للشهر الحالي مراجعة بعد، يكون الرقم المعروض هو متوسط كل المراجعات منذ البداية — فالرقم المكتوب أمامه «نوفمبر» قد يحمل في حقيقته يوليو.<br><br>وفي شهر سابق تُعالَج الحالة نفسها بطريقة أخرى، بتنحية الوزن، مما يجعل مقارنة شهر بآخر صعبة.</div><div class="b c"><div class="h">المقترح</div>أن يظهر الشهر الحالي بوصفه <b>«في انتظار مراجعة»</b> بدل ملئه برقم أقدم، وأن تُعالَج المراجعة الغائبة بالطريقة نفسها في كل الأشهر.</div></div>'}},

  {id:'a3',card:1,color:C.rose,tag:{en:'Today → Proposal',ar:'حالياً ← المقترح'},
   t:{en:'The delivery checklist opens partly ticked',ar:'قائمة التسليم تُفتح وبعضها مُعلَّم'},
   b:{en:'<div class="pair"><div class="b a"><div class="h">Today</div>The five delivery checkpoints open with three already ticked and two clear. Saving without changing anything records 60%, in a component carrying 20% of the score.</div><div class="b c"><div class="h">Proposal</div>All five open clear, so each tick is a decision rather than a default.<br><br>And "Monitoring visit completed" comes out of this list, since monitoring hours are already scored in their own component.</div></div>',
      ar:'<div class="pair"><div class="b a"><div class="h">حالياً</div>تُفتح نقاط التسليم الخمس وثلاث منها مُعلَّمة سلفاً واثنتان فارغتان. والحفظ دون تغيير يسجّل ٦٠٪، في بند يحمل ٢٠٪ من الدرجة.</div><div class="b c"><div class="h">المقترح</div>تُفتح الخمس فارغة، فتصبح كل علامة قراراً لا افتراضاً.<br><br>كما تخرج علامة «Monitoring visit completed» من هذه القائمة، لأن ساعات المونيتورينج تُحتسب أصلاً في بندها الخاص.</div></div>'}}
 ]},

/* ===== 7 · WHAT STAYS ===== */
{id:'w',color:C.teal,
 t:{en:'7 · What stays exactly as it is',ar:'٧ · ما يبقى كما هو تماماً'},
 s:{en:'The weighting does not change',ar:'الأوزان لا تتغير'},
 c:[
  {id:'w1',card:1,color:C.teal,tag:{en:'Unchanged',ar:'دون تغيير'},
   t:{en:'Every weight stays the same',ar:'كل وزن يبقى كما هو'},
   b:{en:'<p>The weighting reflects what the unit values, and nothing in it needs to change. Everything proposed here is about <b>how each component is measured</b>, not what it is worth.</p><table><tr><th>Component</th><th>Weight</th></tr><tr><td>Attendance</td><td class="n">10</td></tr><tr><td>Delivery-deadline reliability</td><td class="n">8</td></tr><tr><td>Early-delivery bonus</td><td class="n">2</td></tr><tr><td>Design quality</td><td class="n">25</td></tr><tr><td>Process compliance</td><td class="n">20</td></tr><tr><td>Productive hours</td><td class="n">15</td></tr><tr><td>Training monitoring</td><td class="n">5</td></tr><tr><td>Client satisfaction</td><td class="n">5</td></tr><tr><td>Recognition</td><td class="n">5</td></tr><tr><td>Growth &amp; contribution</td><td class="n">5</td></tr><tr><td><b>Total</b></td><td class="n"><b>100</b></td></tr></table>',
      ar:'<p>الأوزان تعكس ما تقدّره الوحدة، ولا شيء فيها يحتاج إلى تغيير. وكل ما يُقترح هنا يتعلق بـ <b>كيفية قياس كل بند</b>، لا بقيمته.</p><table><tr><th>البند</th><th>الوزن</th></tr><tr><td>الحضور</td><td class="n">١٠</td></tr><tr><td>الالتزام بـ deadline التسليم</td><td class="n">٨</td></tr><tr><td>بونص التسليم المبكر</td><td class="n">٢</td></tr><tr><td>جودة التصميم</td><td class="n">٢٥</td></tr><tr><td>Process Compliance</td><td class="n">٢٠</td></tr><tr><td>الساعات المنتجة</td><td class="n">١٥</td></tr><tr><td>Training Monitoring</td><td class="n">٥</td></tr><tr><td>تقييم العميل</td><td class="n">٥</td></tr><tr><td>التقدير (High Fives)</td><td class="n">٥</td></tr><tr><td>التطور والمساهمة</td><td class="n">٥</td></tr><tr><td><b>المجموع</b></td><td class="n"><b>١٠٠</b></td></tr></table>'}},

  {id:'w2',card:1,color:C.teal,tag:{en:'Proposal',ar:'مقترح'},
   t:{en:'What a full 100 means',ar:'ماذا تعني المئة الكاملة'},
   b:{en:'<p>Today it is not clear what reaching 100 requires, and there are no published bands for the final figure — so it is not stated what 78 means or what it should lead to.</p><p>Setting 100 to mean <b>the agreed target was met in every component</b> makes it reachable, and anything beyond it sits in a capped bonus of up to +5.</p><table><tr><th>Score</th><th>Reads as</th></tr><tr><td class="n">90+</td><td>Outstanding</td></tr><tr><td class="n">80–89</td><td>Exceeds</td></tr><tr><td class="n">70–79</td><td>Meets</td></tr><tr><td class="n">60–69</td><td>Developing — a 1:1 and a plan</td></tr><tr><td class="n">below 60</td><td>Needs support</td></tr></table><p>With the proposals above, the targets behind that 100 are: productive hours at 87% of the month’s own capacity, 12 monitoring hours, quality rated against written levels, and delivery measured against an agreed date.</p>',
      ar:'<p>ليس واضحاً اليوم ما الذي يتطلبه الوصول إلى ١٠٠، ولا توجد Bands منشورة للرقم النهائي — فلا يُعرَف ماذا تعني ٧٨ ولا إلامَ تؤدي.</p><p>وجعل المئة تعني <b>تحقيق الهدف المتفق عليه في كل بند</b> يجعلها قابلة للبلوغ، وما يتجاوزها يدخل في بونص بسقف أقصاه +٥.</p><table><tr><th>الدرجة</th><th>تُقرأ</th></tr><tr><td class="n">٩٠+</td><td>متميّز</td></tr><tr><td class="n">٨٠–٨٩</td><td>فوق المتوقع</td></tr><tr><td class="n">٧٠–٧٩</td><td>في المتوقع</td></tr><tr><td class="n">٦٠–٦٩</td><td>قيد التطور — جلسة ١:١ وخطة</td></tr><tr><td class="n">أقل من ٦٠</td><td>يحتاج دعماً</td></tr></table><p>ومع المقترحات السابقة تصبح الأهداف خلف هذه المئة: ساعات منتجة بنسبة ٨٧٪ من طاقة الشهر نفسه، و١٢ ساعة مونيتورينج، وجودة تُقيَّم مقابل مستويات مكتوبة، وتسليم يُقاس مقابل تاريخ متفق عليه.</p>'}}
 ]},

/* ===== 8 · BASIS ===== */
{id:'b',color:C.amber,
 t:{en:'8 · The basis for the numbers',ar:'٨ · الأساس الذي بُنيت عليه الأرقام'},
 s:{en:'Calendar, published benchmarks, and our own rate',ar:'التقويم، ومعايير منشورة، ومعدّلنا الفعلي'},
 c:[
  {id:'b1',card:1,color:C.amber,tag:{en:'Calendar',ar:'التقويم'},
   t:{en:'How 151 hours is reached',ar:'كيف وصلنا إلى ١٥١ ساعة'},
   b:{en:'<table><tr><th>Month, 2026</th><th>Working days</th><th>Hours</th></tr><tr><td>February</td><td class="n">20</td><td>160</td></tr><tr><td>March</td><td class="n">23</td><td>184</td></tr><tr><td>November</td><td class="n">22</td><td>176</td></tr><tr><td><b>Average</b></td><td class="n">21.75</td><td class="n">174</td></tr></table><div class="mono"><span class="sug">174h   average working month\n− 14h   annual leave (21 days ÷ 12)\n−  9h   public holidays (≈13 days ÷ 12)\n──────\n= 151h  available</span></div><p>The 21 days of annual leave is the figure the system holds per person, and matches Egyptian labour law from the second year of service. The public-holiday figure is an estimate and worth confirming with HR.</p>',
      ar:'<table><tr><th>شهر ٢٠٢٦</th><th>أيام العمل</th><th>ساعات</th></tr><tr><td>فبراير</td><td class="n">٢٠</td><td>١٦٠</td></tr><tr><td>مارس</td><td class="n">٢٣</td><td>١٨٤</td></tr><tr><td>نوفمبر</td><td class="n">٢٢</td><td>١٧٦</td></tr><tr><td><b>المتوسط</b></td><td class="n">٢١.٧٥</td><td class="n">١٧٤</td></tr></table><div class="mono"><span class="sug">174h   متوسط شهر العمل\n− 14h   إجازة سنوية (21 يوماً ÷ 12)\n−  9h   إجازات رسمية (≈13 يوماً ÷ 12)\n──────\n= 151h  متاحة</span></div><p>ورقم ٢١ يوم إجازة سنوية هو ما يحتفظ به النظام لكل فرد، ويتوافق مع قانون العمل المصري من السنة الثانية للخدمة. أما رقم الإجازات الرسمية فتقدير يستحسن تأكيده مع الـ HR.</p>'}},

  {id:'b2',card:1,color:C.amber,tag:{en:'Benchmarks',ar:'معايير منشورة'},
   t:{en:'Where comparable teams set the bar',ar:'أين تضع الفرق المشابهة الحد'},
   b:{en:'<table><tr><th>Role type</th><th>Range</th><th>Source</th></tr><tr><td>Professional services — actual 2025</td><td class="n">66.4%</td><td>SPI Research 2026</td></tr><tr><td>Professional services — optimum</td><td class="n ok">75%</td><td>SPI Research</td></tr><tr><td>Sustainable range</td><td class="n">70–80%</td><td>SPI / Kantata</td></tr><tr><td>Agency producers (designers)</td><td class="n">60–80%</td><td>Parakeeto</td></tr><tr><td>Agency actual, measured</td><td class="n">55%</td><td>Toggl benchmarks</td></tr><tr><td>Architecture &amp; engineering — median</td><td class="n">58.9%</td><td>Deltek Clarity 2026</td></tr></table><div class="q">"Firms exceeding 80% utilization see higher burnout and attrition, leading to long-term performance decline." — SPI Research, 2025</div><p>Both SPI and Kantata classify training, business development, internal reviews and mentoring as essential non-billable work, and allocate 20–30% of capacity to it. A coordination allowance is standard practice, not an exception.</p><div class="src">There is no published utilization benchmark for instructional designers specifically, so agency producer figures are the closest comparison. Primary sources: SPI Research, Kantata.</div>',
      ar:'<table><tr><th>نوع الدور</th><th>النطاق</th><th>المصدر</th></tr><tr><td>الخدمات المهنية — الفعلي ٢٠٢٥</td><td class="n">٦٦.٤٪</td><td>SPI Research 2026</td></tr><tr><td>الخدمات المهنية — الأمثل</td><td class="n ok">٧٥٪</td><td>SPI Research</td></tr><tr><td>النطاق المستدام</td><td class="n">٧٠–٨٠٪</td><td>SPI / Kantata</td></tr><tr><td>المنتجون في الوكالات (مصممون)</td><td class="n">٦٠–٨٠٪</td><td>Parakeeto</td></tr><tr><td>الوكالات — الفعلي المقاس</td><td class="n">٥٥٪</td><td>Toggl</td></tr><tr><td>الهندسة والعمارة — الوسيط</td><td class="n">٥٨.٩٪</td><td>Deltek Clarity 2026</td></tr></table><div class="q">«الشركات التي تتجاوز ٨٠٪ استغلالية تشهد ارتفاعاً في الاحتراق الوظيفي والتسرب، ما يؤدي إلى تراجع الأداء على المدى الطويل.» — SPI Research، ٢٠٢٥</div><p>ويصنّف كلٌّ من SPI و Kantata التدريبَ وتطويرَ الأعمال والمراجعاتِ الداخلية والإرشادَ ضمن العمل الأساسي غير المفوتر، ويخصصان له ٢٠–٣٠٪ من الطاقة. فبدل التنسيق ممارسة قياسية لا استثناء.</p><div class="src">لا يوجد معيار Utilization منشور للمصممين التعليميين تحديداً، فأرقام المنتجين في الوكالات هي أقرب مقارنة. المصادر الأساسية: SPI Research و Kantata.</div>'}},

/* ===== engine ===== */
var LANG='en',W={0:230,1:262,card:398},GAP=66,VGAP=15;
var canvas=document.getElementById('canvas'),wires=document.getElementById('wires'),stage=document.getElementById('stage');
function walk(n,p,lv){n._p=p;n._lv=lv;if(n.open===undefined)n.open=false;(n.c||[]).forEach(function(k){walk(k,n,lv+1);});}
walk(TREE,null,0);TREE.open=true;
function wOf(n){return n.card?W.card:(W[n._lv]||W[1]);}
function colOf(n){return n.color||(n._p?colOf(n._p):C.blue);}
function T(o){return o?(o[LANG]||o.en||''):'';}
function vis(){var o=[];(function r(n){o.push(n);if(n.open&&n.c)n.c.forEach(r);})(TREE);return o;}

function render(){
  var V=vis(),maxLv=0;V.forEach(function(n){if(n._lv>maxLv)maxLv=n._lv;});
  var rtl=(LANG==='ar'),colW=[];
  for(var l=0;l<=maxLv;l++){var w=0;V.forEach(function(n){if(n._lv===l&&wOf(n)>w)w=wOf(n);});colW[l]=(w||W[1])+GAP;}
  var off=[0];for(var i=1;i<=maxLv;i++)off[i]=off[i-1]+colW[i-1];
  var totalW=off[maxLv]+(colW[maxLv]||300)+20;
  Array.prototype.slice.call(canvas.querySelectorAll('.node')).forEach(function(e){e.remove();});
  V.forEach(function(n){
    var el=document.createElement('div'),kids=(n.c||[]).length,col=colOf(n);
    el.className='node lv'+Math.min(n._lv,1)+(n.card?' card':'')+(kids?' tappable':'')+(kids&&n.open?' open':'');
    el.style.width=wOf(n)+'px';
    if(n._lv===1)el.style.borderColor=col;
    if(n.card)el.style.borderInlineStartColor=col;
    var h='<div class="pad">';
    if(n.tag)h+='<span class="tag" style="background:'+col+'22;color:'+col+'">'+T(n.tag)+'</span>';
    h+='<div class="ttl">'+T(n.t)+'</div>';
    if(n.s)h+='<div class="sht">'+T(n.s)+'</div>';
    if(n.b)h+='<div class="bd">'+T(n.b)+'</div>';
    h+='</div>';
    if(kids)h+='<div class="toggle" style="'+(rtl?'left:-34px;':'right:-34px;')+(n.open?('background:'+col+';border-color:'+col+';'):'')+'">'+(n.open?'−':'+'+kids)+'</div>';
    el.innerHTML=h;
    if(kids){el.tabIndex=0;el.setAttribute('role','button');
      el.addEventListener('click',function(e){e.stopPropagation();n.open=!n.open;render();if(n.open)setTimeout(function(){focusOn(n);},40);});
      el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}});}
    n._el=el;canvas.appendChild(el);
  });
  V.forEach(function(n){n._h=n._el.offsetHeight;});
  var cur=0;
  (function place(n){
    if(n.open&&n.c&&n.c.length){n.c.forEach(place);n._y=(n.c[0]._y+n.c[n.c.length-1]._y)/2;}
    else{n._y=cur+n._h/2;cur+=n._h+VGAP;}
  })(TREE);
  var mn=Infinity,mx=-Infinity;
  V.forEach(function(n){if(n._y-n._h/2<mn)mn=n._y-n._h/2;if(n._y+n._h/2>mx)mx=n._y+n._h/2;});
  var sh=42-mn,H=mx-mn+150;
  canvas.style.width=totalW+'px';canvas.style.height=H+'px';
  V.forEach(function(n){
    var x=rtl?(totalW-off[n._lv]-wOf(n)-20):(off[n._lv]+20);
    n._x=x;n._el.style.left=x+'px';n._el.style.top=(n._y+sh-n._h/2)+'px';
  });
  var d='';
  wires.setAttribute('width',totalW);wires.setAttribute('height',H);
  wires.setAttribute('viewBox','0 0 '+totalW+' '+H);
  V.forEach(function(n){
    if(!n._p)return;var p=n._p;
    var x1=rtl?(n._x+wOf(n)):n._x,x2=rtl?p._x:(p._x+wOf(p));
    var y1=n._y+sh,y2=p._y+sh,m=(x1+x2)/2;
    d+='<path fill="none" stroke-linecap="round" d="M '+x1+' '+y1+' C '+m+' '+y1+', '+m+' '+y2+', '+x2+' '+y2+'" stroke="'+colOf(n)+'" stroke-width="'+(n._lv===1?2.4:1.5)+'" opacity="'+(n._lv===1?.8:.5)+'"/>';
  });
  wires.innerHTML=d;
}
function focusOn(n){if(!n._el)return;
  stage.scrollTo({left:Math.max(0,n._el.offsetLeft-stage.clientWidth*0.4),
                  top:Math.max(0,n._el.offsetTop-stage.clientHeight*0.32),behavior:'smooth'});}
function buildNav(){
  var nr=document.getElementById('navrow');nr.innerHTML='';
  TREE.c.forEach(function(b){
    var el=document.createElement('button');el.className='nav';
    el.innerHTML='<span class="dot" style="background:'+b.color+'"></span>'+T(b.t);
    el.addEventListener('click',function(){TREE.c.forEach(function(x){x.open=(x===b);});render();setTimeout(function(){focusOn(b);},50);});
    nr.appendChild(el);
  });
}
function applyLang(){
  var u=UI[LANG];
  document.body.setAttribute('data-lang',LANG);
  document.documentElement.lang=LANG;
  document.documentElement.dir=(LANG==='ar'?'rtl':'ltr');
  document.getElementById('h1').textContent=u.h1;
  document.getElementById('sub').textContent=u.sub;
  document.getElementById('bAll').textContent=u.all;
  document.getElementById('bTop').textContent=u.top;
  document.getElementById('bTheme').textContent=u.theme;
  document.getElementById('bLang').textContent=u.lang;
  document.getElementById('hint').textContent=u.hint;
  buildNav();render();
  setTimeout(function(){stage.scrollTo({left:(LANG==='ar'?stage.scrollWidth:0),top:0});},50);
}
document.getElementById('bLang').addEventListener('click',function(){LANG=(LANG==='en'?'ar':'en');applyLang();});
document.getElementById('bAll').addEventListener('click',function(){(function r(n){if(n.c&&n.c.length)n.open=true;(n.c||[]).forEach(r);})(TREE);render();});
document.getElementById('bTop').addEventListener('click',function(){(function r(n){if(n!==TREE)n.open=false;(n.c||[]).forEach(r);})(TREE);TREE.open=true;render();stage.scrollTo({left:(LANG==='ar'?stage.scrollWidth:0),top:0,behavior:'smooth'});});
document.getElementById('bTheme').addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',c==='light'?'dark':'light');});
TREE.c[0].open=true;applyLang();
window.addEventListener('resize',render);
</script>
